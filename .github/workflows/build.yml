name: Pruebas y APK de depuración

# Primera ejecución en verde: 2026-10-21 (#1).
# El trabajo "informe" publica un resumen y los registros en la rama ci-results
# (solo la escribe este flujo; ver docs/decisiones.md, D-011).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Una ejecución nueva cancela la anterior de la misma rama. Si una prueba se colgara,
# no bloquearía las siguientes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fijada por huella (digest): la clave de depuración que firma el APK viene dentro de la
  # imagen. Si la imagen cambiara, la firma cambiaría y Android no dejaría instalar el APK
  # nuevo sobre el anterior. Digest leído en la ejecución #10 (barichello/godot-ci:4.7.2).
  GODOT_IMAGE: barichello/godot-ci@sha256:cdcca31e9194fd59a68a63f4b1b9c3981716819c520cd6f7966c5d72ca7246bd

jobs:
  pruebas:
    name: Pruebas sin ventana
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Versión de Godot en la imagen
        run: |
          mkdir -p logs
          docker run --rm "$GODOT_IMAGE" godot --headless --version 2>&1 | tee logs/version.txt

      # Los modelos 3D (.gltf) y las texturas hay que importarlos antes de poder cargarlos:
      # en un clon limpio no existe la carpeta .godot con el resultado de la importación.
      - name: Importar recursos
        timeout-minutes: 5
        run: |
          set -o pipefail
          mkdir -p logs
          docker run --rm -v "$PWD:/work" -w /work "$GODOT_IMAGE" \
            timeout 240 godot --headless --path game --import 2>&1 | tee logs/importacion-pruebas.txt || true
          # El código de salida de --import no es fiable (en la exportación también se ignora);
          # si la importación fallara, las pruebas de test_diorama.gd no cargarían los modelos y fallarían.

      - name: Ejecutar pruebas
        timeout-minutes: 10
        run: |
          set -o pipefail
          mkdir -p logs
          # "timeout 300" corta dentro del contenedor si algo se cuelga y deja el registro.
          docker run --rm -v "$PWD:/work" -w /work "$GODOT_IMAGE" \
            timeout 420 godot --headless --path game -s res://tests/run_tests.gd 2>&1 | tee logs/pruebas.txt

      - name: Comprobar que el ejecutor detecta fallos
        timeout-minutes: 8
        run: |
          set +e
          mkdir -p logs
          docker run --rm -v "$PWD:/work" -w /work "$GODOT_IMAGE" \
            timeout 420 godot --headless --path game -s res://tests/run_tests.gd -- --selftest-fail 2>&1 | tee logs/selftest.txt
          codigo=${PIPESTATUS[0]}
          echo "Código de salida con el fallo intencionado: $codigo" | tee -a logs/selftest.txt
          if [ "$codigo" -eq 0 ]; then
            echo "::error::El ejecutor no detectó el fallo intencionado"
            exit 1
          fi

      - name: Guardar registros de las pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-log-pruebas
          path: logs/
          retention-days: 7
          if-no-files-found: warn

  apk:
    name: APK de depuración
    needs: pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Historial completo: el número de versión del APK es el número de commits.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diagnóstico del entorno de Android en la imagen
        run: |
          mkdir -p logs
          docker run --rm "$GODOT_IMAGE" bash -c '
            echo "--- plantillas de exportación ---"
            ls /root/.local/share/godot/export_templates/ 2>&1
            echo "--- ajustes del editor ---"
            ls /root/.config/godot/ 2>&1
            cat /root/.config/godot/editor_settings-4*.tres 2>&1 | head -30
            echo "--- clave de depuración ---"
            ls -l /root/debug.keystore 2>&1
            keytool -list -keystore /root/debug.keystore -storepass android 2>&1 | head -6
            echo "--- java ---"
            java -version 2>&1 | head -1
          ' 2>&1 | tee logs/diagnostico.txt

      - name: Numerar el APK con un código de versión creciente
        run: |
          # Android solo deja instalar una versión encima de otra si su código es mayor.
          # Se usa el número de commits, que solo crece mientras no se reescriba el historial.
          mkdir -p logs
          CODE=$(git rev-list --count HEAD)
          sed -i "s|^version/code=.*|version/code=${CODE}|" game/export_presets.cfg
          {
            echo "version/code del APK: ${CODE}"
            grep -n '^version/' game/export_presets.cfg
            docker image inspect --format 'imagen: {{index .RepoDigests 0}}' "$GODOT_IMAGE" 2>&1 || true
          } | tee logs/numeracion.txt

      - name: Importar recursos y exportar el APK
        run: |
          set -o pipefail
          mkdir -p build logs
          docker run --rm -v "$PWD:/work" -w /work \
            -e GODOT_ANDROID_KEYSTORE_DEBUG_PATH=/root/debug.keystore \
            -e GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey \
            -e GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android \
            "$GODOT_IMAGE" bash -c '
              set -e
              godot --headless --path game --import || true
              godot --headless --path game --export-debug "Android" /work/build/reinos-tycoon-debug.apk
              ls -l /work/build
              echo "--- firma del APK (debe ser siempre la misma) ---"
              "$(ls -d /usr/lib/android-sdk/build-tools/*/ | tail -1)apksigner" verify --print-certs /work/build/reinos-tycoon-debug.apk 2>&1 | head -4 || true
            ' 2>&1 | tee logs/export.txt

      - name: Comprobar que el APK existe y no está vacío
        run: test -s build/reinos-tycoon-debug.apk

      # archive: false sube el .apk tal cual (sin envolverlo en un .zip), de modo que
      # se descarga como un archivo instalable. Con archive: false el nombre del
      # artefacto es el nombre del archivo y el parámetro "name" se ignora.
      # Requiere upload-artifact v7 o superior.
      - name: Guardar el APK como artefacto (sin comprimir)
        uses: actions/upload-artifact@v7
        with:
          path: build/reinos-tycoon-debug.apk
          archive: false
          retention-days: 30
          if-no-files-found: error

      - name: Guardar registros de la exportación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-log-apk
          path: logs/
          retention-days: 7
          if-no-files-found: warn

  informe:
    name: Informe para el repositorio
    needs: [pruebas, apk]
    if: always()
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - name: Descargar los registros
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: ci-log-*
          merge-multiple: true
          path: informe

      - name: Publicar el informe en la rama ci-results
        env:
          RESULT_PRUEBAS: ${{ needs.pruebas.result }}
          RESULT_APK: ${{ needs.apk.result }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p informe
          {
            echo "commit: $SHA"
            echo "ejecucion: #$RUN_NUMBER (id $RUN_ID)"
            echo "pruebas: $RESULT_PRUEBAS"
            echo "apk: $RESULT_APK"
          } > informe/RESUMEN.txt
          cd informe
          git init -q -b ci-results
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Informe de la ejecucion #$RUN_NUMBER del commit $SHA"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${REPO}.git" ci-results
